<script>
(() => {
  'use strict';

  const DATA = JSON.parse(document.getElementById('topology-data').textContent);
  const KIND_LABEL = { node: 'Node', topic: 'Topic', service: 'Service', action: 'Action' };
  const RELATION_LABEL = {
    publishes: '发布', subscribes: '订阅', serves: '服务端', calls: '客户端',
    serves_action: 'Action 服务端', calls_action: 'Action 客户端',
  };
  const INFRA_PATTERNS = [
    /^\/rosout$/,
    /^\/parameter_events$/,
    /\/(describe_parameters|get_parameter_types|get_parameters|list_parameters|set_parameters|set_parameters_atomically)$/,
  ];
  const OWNER_ORDER = ['004-i7', '004-nx', 'unknown'];
  const OWNER_META = {
    '004-i7': { label: '004-i7', sub: '已确认进程归属', className: 'i7' },
    '004-nx': { label: '004-nx', sub: '已确认进程归属', className: 'nx' },
    unknown: { label: '未归属 / DDS', sub: '不猜测运行板卡', className: 'unknown' },
  };

  const state = {
    rootKey: null,
    selectedKey: null,
    rootChain: null,
    highlightChain: null,
    traceRaw: false,
    enabledKinds: new Set(['topic', 'service', 'action']),
    zoom: 0.85,
    searchIndex: -1,
    searchResults: [],
    lastLayout: null,
  };

  const records = new Map();
  const edges = [];
  const outgoing = new Map();
  const incoming = new Map();
  const nodeDomain = new Map();
  const nodeOwner = new Map();
  const nodeLinks = new Map();

  const keyOf = (kind, name) => `${kind}:${name}`;
  const splitKey = (key) => {
    const index = key.indexOf(':');
    return { kind: key.slice(0, index), name: key.slice(index + 1) };
  };
  const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[char]);
  const sortByName = (a, b) => a.name.localeCompare(b.name, 'zh-CN');
  const infraEndpoint = (record) => record.kind !== 'node' && INFRA_PATTERNS.some((pattern) => pattern.test(record.name));

  function addRecord(record) {
    records.set(record.key, record);
    if (!outgoing.has(record.key)) outgoing.set(record.key, []);
    if (!incoming.has(record.key)) incoming.set(record.key, []);
  }

  for (const domain of DATA.domains) {
    for (const node of domain.nodes) {
      const key = keyOf('node', node.name);
      nodeDomain.set(node.name, { id: domain.id, label: domain.label });
      nodeOwner.set(node.name, node.owner);
      nodeLinks.set(node.name, node.links);
      addRecord({
        key, kind: 'node', name: node.name, types: [], observedOn: ['004-i7', '004-nx'],
        owner: node.owner, domainId: domain.id, domainLabel: domain.label,
        duplicateCount: DATA.duplicates[node.name] || 1,
      });
    }
  }

  for (const kindPlural of ['topics', 'services', 'actions']) {
    const kind = kindPlural.slice(0, -1);
    for (const item of DATA.inventory[kindPlural]) {
      addRecord({
        key: keyOf(kind, item.name), kind, name: item.name, types: item.types || [],
        observedOn: item.observed_on || [], owner: null, domainId: null, domainLabel: null,
        duplicateCount: 1,
      });
    }
  }

  function edgeDirection(nodeKey, endpointKey, relation) {
    if (relation === 'publishes' || relation === 'calls' || relation === 'calls_action') return [nodeKey, endpointKey];
    return [endpointKey, nodeKey];
  }

  for (const domain of DATA.domains) {
    for (const node of domain.nodes) {
      const nodeKey = keyOf('node', node.name);
      for (const link of node.links) {
        const endpointKey = keyOf(link.kind, link.entity);
        if (!records.has(endpointKey)) {
          addRecord({ key: endpointKey, kind: link.kind, name: link.entity, types: [], observedOn: [], owner: null, domainId: null, domainLabel: null, duplicateCount: 1 });
        }
        const [from, to] = edgeDirection(nodeKey, endpointKey, link.relation);
        const edge = { from, to, relation: link.relation, kind: link.kind, nodeKey, endpointKey };
        edges.push(edge);
        outgoing.get(from).push(edge);
        incoming.get(to).push(edge);
      }
    }
  }

  const searchable = [...records.values()].sort((a, b) => {
    const kindOrder = { node: 0, topic: 1, service: 2, action: 3 };
    return kindOrder[a.kind] - kindOrder[b.kind] || sortByName(a, b);
  });

  function endpointOwners(key, withinKeys = null) {
    const owners = new Set();
    const linked = [...(incoming.get(key) || []), ...(outgoing.get(key) || [])];
    for (const edge of linked) {
      const otherKey = edge.from === key ? edge.to : edge.from;
      if (withinKeys && !withinKeys.has(otherKey)) continue;
      const other = records.get(otherKey);
      if (other?.kind === 'node' && other.owner && other.owner !== 'unknown') owners.add(other.owner);
    }
    return owners;
  }

  function recordLane(record, withinKeys = null) {
    if (record.kind === 'node') return record.owner || 'unknown';
    const owners = endpointOwners(record.key, withinKeys);
    return owners.size === 1 ? [...owners][0] : 'unknown';
  }

  function isCrossBoardEndpoint(key) {
    return endpointOwners(key).size > 1;
  }

  function endpointHealth(record) {
    if (record.kind === 'node' || infraEndpoint(record)) return null;
    const related = [...(incoming.get(record.key) || []), ...(outgoing.get(record.key) || [])];
    const roles = new Set(related.map((edge) => edge.relation));
    if (record.kind === 'topic') {
      if (!roles.has('publishes')) return '无已知发布者';
      if (!roles.has('subscribes')) return '无已知订阅者';
    }
    if (record.kind === 'service') {
      if (!roles.has('serves')) return '无已知服务端';
      if (!roles.has('calls')) return '无已知客户端';
    }
    if (record.kind === 'action') {
      if (!roles.has('serves_action')) return '无已知 Action 服务端';
      if (!roles.has('calls_action')) return '无已知 Action 客户端';
    }
    return null;
  }

  function edgeAllowed(edge) {
    if (!state.enabledKinds.has(edge.kind)) return false;
    if (state.traceRaw) return true;
    return !infraEndpoint(records.get(edge.endpointKey));
  }

  function neighbors(key, direction) {
    const list = direction === 'out' ? outgoing.get(key) : incoming.get(key);
    return (list || []).filter(edgeAllowed).map((edge) => ({ edge, key: direction === 'out' ? edge.to : edge.from }));
  }

  function bfs(startKey, direction) {
    const distance = new Map([[startKey, 0]]);
    const queue = [startKey];
    for (let index = 0; index < queue.length; index += 1) {
      const current = queue[index];
      for (const next of neighbors(current, direction)) {
        if (distance.has(next.key)) continue;
        distance.set(next.key, distance.get(current) + 1);
        queue.push(next.key);
      }
    }
    return distance;
  }

  function buildChain(selectedKey) {
    const upstream = bfs(selectedKey, 'in');
    const downstream = bfs(selectedKey, 'out');
    const keys = new Set([...upstream.keys(), ...downstream.keys()]);
    const depth = new Map([[selectedKey, 0]]);
    const cycleKeys = new Set();
    for (const key of keys) {
      if (key === selectedKey) continue;
      const up = upstream.get(key);
      const down = downstream.get(key);
      if (up != null && down != null) cycleKeys.add(key);
      if (up != null && down != null) depth.set(key, down <= up ? down : -up);
      else if (up != null) depth.set(key, -up);
      else depth.set(key, down);
    }
    const chainEdges = edges.filter((edge) => keys.has(edge.from) && keys.has(edge.to) && edgeAllowed(edge));
    return { keys, upstream, downstream, depth, cycleKeys, edges: chainEdges };
  }

  function buildHighlightChain(rootChain, selectedKey) {
    const full = buildChain(selectedKey);
    const keys = new Set([...full.keys].filter((key) => rootChain.keys.has(key)));
    if (!keys.has(selectedKey)) keys.add(selectedKey);
    const keepDistances = (distances) => new Map([...distances].filter(([key]) => keys.has(key)));
    return {
      keys,
      upstream: keepDistances(full.upstream),
      downstream: keepDistances(full.downstream),
      depth: keepDistances(full.depth),
      cycleKeys: new Set([...full.cycleKeys].filter((key) => keys.has(key))),
      edges: rootChain.edges.filter((edge) => keys.has(edge.from) && keys.has(edge.to)),
    };
  }

  function chainIsNarrowed(rootChain, highlightChain) {
    return Boolean(rootChain && highlightChain && (
      rootChain.keys.size !== highlightChain.keys.size ||
      rootChain.edges.length !== highlightChain.edges.length
    ));
  }

  function formatCaptureTime(value) {
    return new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(value));
  }

  function kindBadge(kind) {
    return `<span class="kind-badge ${kind}">${KIND_LABEL[kind]}</span>`;
  }

  function renderOverview() {
    const laneGrid = document.getElementById('lane-grid');
    const owners = new Map(OWNER_ORDER.map((owner) => [owner, []]));
    for (const record of records.values()) {
      if (record.kind === 'node') owners.get(record.owner || 'unknown').push(record);
    }

    laneGrid.innerHTML = OWNER_ORDER.map((owner) => {
      const meta = OWNER_META[owner];
      const laneNodes = owners.get(owner).sort(sortByName);
      const domainBlocks = DATA.domains.filter((domain) => domain.id !== 'dds-only').map((domain) => {
        const domainNodes = laneNodes.filter((node) => node.domainId === domain.id);
        if (!domainNodes.length) return '';
        return `<section class="domain-block">
          <div class="domain-head"><span>${escapeHtml(domain.label)}</span><small>${domainNodes.length} nodes</small></div>
          <div class="node-list">${domainNodes.map((node) => `<button class="node-chip" type="button" data-select="${escapeHtml(node.key)}" title="${escapeHtml(node.name)}">
            <span class="node-name mono">${escapeHtml(node.name)}${node.duplicateCount > 1 ? `<span class="duplicate-flag">×${node.duplicateCount}</span>` : ''}</span>
            <span class="node-links">${nodeLinks.get(node.name)?.length || 0}</span>
          </button>`).join('')}</div>
        </section>`;
      }).join('');

      const ddsOnly = owner === 'unknown' ? renderDdsOverview() : '';
      return `<article class="owner-lane">
        <header class="lane-head">
          <div class="lane-title"><span class="lane-mark ${meta.className}"></span><div><strong>${meta.label}</strong><small>${meta.sub}</small></div></div>
          <span class="lane-count">${laneNodes.length} nodes</span>
        </header>
        <div class="lane-body">${domainBlocks}${ddsOnly}</div>
      </article>`;
    }).join('');
  }

  function renderDdsOverview() {
    const orphans = [...records.values()].filter((record) => record.kind === 'topic' && !(incoming.get(record.key)?.length || outgoing.get(record.key)?.length));
    return `<section class="dds-block">
      <strong>未归属 DDS 端点 · ${orphans.length} Topics</strong>
      <p>仅从 004-i7 探针可见，没有标准 ROS Node 归属；“可见”不代表进程运行在 i7。</p>
      <div class="dds-samples">${orphans.slice(0, 8).map((record) => `<button class="dds-sample" type="button" data-select="${escapeHtml(record.key)}" title="${escapeHtml(record.name)}">${escapeHtml(record.name)}</button>`).join('')}</div>
    </section>`;
  }

  function renderEmptyDetails() {
    document.getElementById('details-inner').innerHTML = `<div class="empty-detail"><div><strong>选择一个 ROS 对象</strong><p>从总览点击 Node，或使用顶部全局搜索。详情会固定显示原始名称、关系角色、板卡证据和上下游链路。</p></div></div>`;
  }

  function relationRows(record) {
    const relatedEdges = [...(incoming.get(record.key) || []), ...(outgoing.get(record.key) || [])];
    return relatedEdges.map((edge) => {
      const otherKey = edge.from === record.key ? edge.to : edge.from;
      const other = records.get(otherKey);
      return { edge, other, role: RELATION_LABEL[edge.relation] || edge.relation };
    }).sort((a, b) => a.role.localeCompare(b.role, 'zh-CN') || sortByName(a.other, b.other));
  }

  function renderPathBlock(record, path) {
    if (!path) return '';
    const layers = new Map();
    for (const key of path.keys) {
      const depth = path.depth.get(key) ?? 0;
      if (!layers.has(depth)) layers.set(depth, []);
      layers.get(depth).push(records.get(key));
    }
    const layerHtml = [...layers.entries()].sort(([a], [b]) => a - b).map(([depth, layerRecords]) => {
      const label = depth < 0 ? `上游 ${Math.abs(depth)}` : depth > 0 ? `下游 ${depth}` : '当前选择';
      return `<div class="path-layer">
        <span class="path-layer-label">${label}</span>
        ${layerRecords.sort(sortByName).map((item) => `<button class="path-step ${item.key === record.key ? 'current' : ''}" type="button" data-highlight="${escapeHtml(item.key)}" title="${escapeHtml(item.name)}"><i class="kind-dot ${item.kind}"></i><span class="path-step-name">${escapeHtml(item.name)}</span></button>`).join('')}
      </div>`;
    }).join('');
    return `<section class="path-block" aria-label="当前高亮数据链路">
      <div class="path-block-head"><div><strong>当前高亮数据链路</strong><small>按方向和深度单独展开</small></div><span class="path-count">${path.keys.size} 对象 · ${path.edges.length} 关系</span></div>
      <div class="path-track">${layerHtml}</div>
    </section>`;
  }

  function renderDetails(record, chain = null) {
    const lane = recordLane(record, chain?.keys || null);
    const observed = record.observedOn?.length ? record.observedOn.join(' · ') : '无探针字段';
    const health = endpointHealth(record);
    const crossBoard = record.kind !== 'node' && isCrossBoardEndpoint(record.key);
    const relations = relationRows(record);
    const filteredCount = relations.filter(({ edge }) => !state.traceRaw && infraEndpoint(records.get(edge.endpointKey))).length;
    const upstreamCount = chain ? Math.max(0, chain.upstream.size - 1) : neighbors(record.key, 'in').length;
    const downstreamCount = chain ? Math.max(0, chain.downstream.size - 1) : neighbors(record.key, 'out').length;

    let warning = '';
    if (record.duplicateCount > 1) warning += `<div class="warning">同名 Node 共 ${record.duplicateCount} 个实例。ROS CLI 只能按名称聚合关系，无法可靠分离各实例；本页保留实例数量，不伪造实例级归属。</div>`;
    if (record.kind === 'node' && record.owner === 'unknown') warning += `<div class="warning">进程运行板卡未被证据确认。两板都能观察到该 Node，不等于它同时运行在两板。</div>`;
    if (record.kind !== 'node' && !relations.length) warning += `<div class="warning">DDS-only 端点：快照中没有标准 ROS Node 关系，无法继续追踪上下游。</div>`;
    if (health) warning += `<div class="warning">链路边界：${escapeHtml(health)}。这可能是合法边界，也可能是采集时未发现或运行异常。</div>`;
    if (crossBoard) warning += `<div class="warning">跨板端点：相邻 Node 的已确认归属同时包含 004-i7 与 004-nx。</div>`;

    document.getElementById('details-inner').innerHTML = `
      ${renderPathBlock(record, chain)}
      <div class="details-kicker"><span class="kind-dot ${record.kind}"></span>${KIND_LABEL[record.kind]} 详情</div>
      <h2>${escapeHtml(record.name)}</h2>
      <p class="detail-lead">点击画布或右侧链路中的对象，会高亮它的完整上下游分支；完整图仍保留为背景。</p>
      <div class="info-grid">
        <div class="info-cell"><span>链路上游</span><strong>${upstreamCount}</strong></div>
        <div class="info-cell"><span>链路下游</span><strong>${downstreamCount}</strong></div>
        <div class="info-cell"><span>${record.kind === 'node' ? '进程归属' : '画布泳道'}</span><strong>${OWNER_META[lane].label}</strong></div>
        <div class="info-cell"><span>观测位置</span><strong title="${escapeHtml(observed)}">${escapeHtml(observed)}</strong></div>
      </div>
      ${warning}
      ${record.domainLabel ? `<section class="detail-section"><h3>功能域</h3><div class="type-list"><span class="type-chip">${escapeHtml(record.domainLabel)}</span></div></section>` : ''}
      <section class="detail-section"><h3>ROS 类型 <span>${record.types?.length || 0}</span></h3><div class="type-list">${record.types?.length ? record.types.map((type) => `<span class="type-chip" title="${escapeHtml(type)}">${escapeHtml(type)}</span>`).join('') : '<span class="type-chip">快照未提供</span>'}</div></section>
      <section class="detail-section"><h3>直接关系 <span>${relations.length}</span></h3><div class="relation-list">${relations.map(({ edge, other, role }) => `<button class="relation-item" type="button" data-highlight="${escapeHtml(other.key)}"><span class="relation-role">${escapeHtml(role)}</span><span class="relation-name">${escapeHtml(other.name)}</span></button>`).join('') || '<span class="detail-lead">无 Node 关系</span>'}</div></section>
      ${filteredCount ? `<div class="source-note">业务链路模式隐藏了 ${filteredCount} 条参数/日志基础设施关系；切换“原始全图”可恢复。</div>` : ''}
      <section class="detail-section"><h3>图例</h3><div class="legend"><span class="legend-item"><i class="legend-line topic"></i>Topic</span><span class="legend-item"><i class="legend-line service"></i>Service</span><span class="legend-item"><i class="legend-line action"></i>Action</span><span class="legend-item"><i class="legend-line cross"></i>跨板</span></div></section>
      <div class="source-note">快照时间 ${formatCaptureTime(DATA.capturedAt)} CST。图谱为离线只读采集，不证明机器当前运行状态；现场重新上线后应以实时 rosgraph / topic 证据复核。</div>`;
  }

  function cardFlags(record, chain) {
    const flags = [];
    if (record.duplicateCount > 1) flags.push(`<span class="card-flag warn">同名 ×${record.duplicateCount}</span>`);
    if (record.kind !== 'node' && isCrossBoardEndpoint(record.key)) flags.push('<span class="card-flag warn">跨板</span>');
    if (endpointHealth(record)) flags.push('<span class="card-flag warn">断链</span>');
    if (chain.cycleKeys.has(record.key)) flags.push('<span class="card-flag">环路</span>');
    return flags.join('');
  }

  function calculateLayout(chain) {
    const depths = [...new Set(chain.depth.values())].sort((a, b) => a - b);
    const minDepth = Math.min(...depths);
    const maxDepth = Math.max(...depths);
    const columns = [];
    for (let depth = minDepth; depth <= maxDepth; depth += 1) columns.push(depth);

    const matrix = new Map();
    for (const owner of OWNER_ORDER) matrix.set(owner, new Map(columns.map((depth) => [depth, []])));
    for (const key of chain.keys) {
      const record = records.get(key);
      const lane = recordLane(record, chain.keys);
      matrix.get(lane).get(chain.depth.get(key)).push(record);
    }
    for (const owner of OWNER_ORDER) for (const list of matrix.get(owner).values()) list.sort(sortByName);

    const cardW = 222;
    const cardH = 52;
    const gapX = 58;
    const gapY = 10;
    const padX = 105;
    const laneTopPad = 48;
    const laneBottomPad = 28;
    const columnWidth = cardW + gapX;
    const width = padX * 2 + columns.length * columnWidth;
    const laneHeights = {};
    for (const owner of OWNER_ORDER) {
      const maxItems = Math.max(1, ...columns.map((depth) => matrix.get(owner).get(depth).length));
      laneHeights[owner] = laneTopPad + maxItems * (cardH + gapY) + laneBottomPad;
    }
    const laneY = {};
    let yCursor = 0;
    for (const owner of OWNER_ORDER) { laneY[owner] = yCursor; yCursor += laneHeights[owner]; }
    const height = yCursor;
    const positions = new Map();

    for (const owner of OWNER_ORDER) {
      for (let columnIndex = 0; columnIndex < columns.length; columnIndex += 1) {
        const depth = columns[columnIndex];
        const list = matrix.get(owner).get(depth);
        list.forEach((record, itemIndex) => {
          positions.set(record.key, {
            x: padX + columnIndex * columnWidth,
            y: laneY[owner] + laneTopPad + itemIndex * (cardH + gapY),
            width: cardW,
            height: cardH,
            owner,
          });
        });
      }
    }
    return { width, height, columns, minDepth, maxDepth, matrix, laneHeights, laneY, positions, cardW, cardH, gapX, padX, columnWidth };
  }

  function edgePath(from, to) {
    const x1 = from.x + from.width;
    const y1 = from.y + from.height / 2;
    const x2 = to.x;
    const y2 = to.y + to.height / 2;
    if (x2 >= x1) {
      const bend = Math.max(28, (x2 - x1) * 0.48);
      return `M ${x1} ${y1} C ${x1 + bend} ${y1}, ${x2 - bend} ${y2}, ${x2} ${y2}`;
    }
    const offset = 32 + Math.min(90, Math.abs(y2 - y1) * 0.12);
    return `M ${x1} ${y1} C ${x1 + offset} ${y1}, ${x2 - offset} ${y2}, ${x2} ${y2}`;
  }

  function renderGraph(chain, highlightChain = chain) {
    const surface = document.getElementById('graph-surface');
    const sizer = document.getElementById('graph-sizer');
    const layout = calculateLayout(chain);
    const narrowed = chainIsNarrowed(chain, highlightChain);
    const highlightedEdges = new Set(highlightChain?.edges || []);
    const highlightedKeys = highlightChain?.keys || chain.keys;
    state.lastLayout = layout;

    const lanes = OWNER_ORDER.map((owner) => `<div class="graph-lane-bg" style="top:${layout.laneY[owner]}px;width:${layout.width}px;height:${layout.laneHeights[owner]}px"><span class="graph-lane-label"><i class="kind-dot ${owner === '004-i7' ? 'topic' : owner === '004-nx' ? 'service' : 'action'}"></i>${OWNER_META[owner].label}</span></div>`).join('');
    const guides = layout.columns.map((depth, index) => {
      const x = layout.padX + index * layout.columnWidth + layout.cardW / 2;
      const label = depth < 0 ? `上游 ${Math.abs(depth)}` : depth > 0 ? `下游 ${depth}` : '当前焦点';
      return `<span class="depth-guide" style="left:${x}px"></span><span class="depth-label" style="left:${x}px">${label}</span>`;
    }).join('');
    const linePaths = chain.edges.map((edge) => {
      const from = layout.positions.get(edge.from);
      const to = layout.positions.get(edge.to);
      if (!from || !to) return '';
      const endpointKey = records.get(edge.from).kind === 'node' ? edge.to : edge.from;
      const cross = isCrossBoardEndpoint(endpointKey);
      const emphasis = narrowed ? (highlightedEdges.has(edge) ? 'highlighted' : 'dimmed') : '';
      return `<path class="edge ${edge.kind} ${cross ? 'cross' : ''} ${emphasis}" d="${edgePath(from, to)}" marker-end="url(#arrow-${edge.kind})"></path>`;
    }).join('');
    const svg = `<svg class="graph-lines" width="${layout.width}" height="${layout.height}" viewBox="0 0 ${layout.width} ${layout.height}" aria-hidden="true">
      <defs>
        <marker id="arrow-topic" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#6aaeff"></path></marker>
        <marker id="arrow-service" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#b98cff"></path></marker>
        <marker id="arrow-action" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#ffbf69"></path></marker>
      </defs>${linePaths}</svg>`;
    const cards = [...chain.keys].map((key) => {
      const record = records.get(key);
      const position = layout.positions.get(key);
      const pathState = narrowed ? (highlightedKeys.has(key) ? 'path-active' : 'dimmed') : '';
      return `<button class="graph-card ${record.kind === 'node' ? '' : 'endpoint'} ${pathState} ${key === state.selectedKey ? 'selected' : ''} ${key === state.rootKey ? 'root-anchor' : ''}" type="button" data-highlight="${escapeHtml(key)}" title="${escapeHtml(record.name)}" style="left:${position.x}px;top:${position.y}px">
        <span class="card-top"><i class="kind-dot ${record.kind}"></i><span class="kind-label">${KIND_LABEL[record.kind]}</span><span class="card-flags">${cardFlags(record, chain)}</span></span>
        <span class="card-name">${escapeHtml(record.name)}</span>
      </button>`;
    }).join('');

    surface.style.width = `${layout.width}px`;
    surface.style.height = `${layout.height}px`;
    surface.style.transform = `scale(${state.zoom})`;
    surface.innerHTML = lanes + guides + svg + cards;
    sizer.style.width = `${Math.max(1, layout.width * state.zoom)}px`;
    sizer.style.height = `${Math.max(1, layout.height * state.zoom)}px`;
  }

  function updateMetrics(chain, highlightChain = chain) {
    const narrowed = chainIsNarrowed(chain, highlightChain);
    document.getElementById('chain-metrics').innerHTML = `<span class="metric-pill">全图 <strong>${chain.keys.size}</strong></span><span class="metric-pill">高亮 <strong>${highlightChain.keys.size}</strong></span><span class="metric-pill">高亮关系 <strong>${highlightChain.edges.length}</strong></span>${narrowed ? '<span class="metric-pill">聚焦中</span>' : ''}`;
  }

  function renderCurrentState(options = {}) {
    const rootRecord = records.get(state.rootKey);
    const selectedRecord = records.get(state.selectedKey);
    if (!rootRecord || !selectedRecord || !state.rootChain || !state.highlightChain) return;
    const narrowed = chainIsNarrowed(state.rootChain, state.highlightChain);
    document.getElementById('overview').hidden = true;
    document.getElementById('focus').hidden = false;
    document.getElementById('focus-title').textContent = rootRecord.name;
    document.getElementById('focus-subtitle').textContent = `${KIND_LABEL[rootRecord.kind]} 根链路 · ${state.traceRaw ? '原始全图' : '业务链路'} · 当前高亮 ${selectedRecord.name}`;
    document.getElementById('clear-path').classList.toggle('visible', narrowed || state.selectedKey !== state.rootKey);
    updateMetrics(state.rootChain, state.highlightChain);
    renderGraph(state.rootChain, state.highlightChain);
    renderDetails(selectedRecord, state.highlightChain);
    closeSearch();
    if (!options.preserveScroll) {
      requestAnimationFrame(() => centerSelected());
    }
  }

  function selectRecord(key, options = {}) {
    if (!records.has(key)) return;
    state.rootKey = key;
    state.selectedKey = key;
    state.rootChain = buildChain(key);
    state.highlightChain = state.rootChain;
    renderCurrentState(options);
  }

  function highlightRecord(key, options = {}) {
    if (!records.has(key)) return;
    if (!state.rootChain || !state.rootChain.keys.has(key)) {
      selectRecord(key, options);
      return;
    }
    state.selectedKey = key;
    state.highlightChain = key === state.rootKey ? state.rootChain : buildHighlightChain(state.rootChain, key);
    renderCurrentState(options);
  }

  function restoreFullChain() {
    if (!state.rootKey || !state.rootChain) return;
    state.selectedKey = state.rootKey;
    state.highlightChain = state.rootChain;
    renderCurrentState();
  }

  function refreshCurrentView(options = {}) {
    if (!state.rootKey) return;
    state.rootChain = buildChain(state.rootKey);
    if (!state.rootChain.keys.has(state.selectedKey)) state.selectedKey = state.rootKey;
    state.highlightChain = state.selectedKey === state.rootKey ? state.rootChain : buildHighlightChain(state.rootChain, state.selectedKey);
    renderCurrentState(options);
  }

  function centerSelected() {
    if (!state.selectedKey || !state.lastLayout) return;
    const position = state.lastLayout.positions.get(state.selectedKey);
    const viewport = document.getElementById('graph-viewport');
    if (!position) return;
    viewport.scrollTo({
      left: Math.max(0, (position.x + position.width / 2) * state.zoom - viewport.clientWidth / 2),
      top: Math.max(0, (position.y + position.height / 2) * state.zoom - viewport.clientHeight / 2),
      behavior: 'smooth',
    });
  }

  function showOverview() {
    state.rootKey = null;
    state.selectedKey = null;
    state.rootChain = null;
    state.highlightChain = null;
    document.getElementById('focus').hidden = true;
    document.getElementById('overview').hidden = false;
    renderEmptyDetails();
  }

  function updateZoom(nextZoom, recenter = true) {
    state.zoom = Math.min(1.2, Math.max(0.45, nextZoom));
    document.getElementById('zoom-value').textContent = `${Math.round(state.zoom * 100)}%`;
    if (state.rootChain) {
      renderGraph(state.rootChain, state.highlightChain);
      if (recenter) requestAnimationFrame(centerSelected);
    }
  }

  function fitZoom() {
    if (!state.lastLayout) return;
    const viewport = document.getElementById('graph-viewport');
    const fit = Math.min(1, (viewport.clientWidth - 32) / state.lastLayout.width, (viewport.clientHeight - 32) / state.lastLayout.height);
    updateZoom(Math.max(0.45, fit));
  }

  function search(query) {
    const normalized = query.trim().toLocaleLowerCase();
    if (!normalized) return [];
    const terms = normalized.split(/\s+/).filter(Boolean);
    return searchable.map((record) => {
      const haystack = `${record.kind} ${record.name} ${(record.types || []).join(' ')} ${record.domainLabel || ''}`.toLocaleLowerCase();
      if (!terms.every((term) => haystack.includes(term))) return null;
      const exact = record.name.toLocaleLowerCase() === normalized ? 1000 : 0;
      const prefix = record.name.toLocaleLowerCase().startsWith(normalized) ? 200 : 0;
      const kindWeight = record.kind === 'node' ? 20 : 0;
      return { record, score: exact + prefix + kindWeight - record.name.length / 1000 };
    }).filter(Boolean).sort((a, b) => b.score - a.score || sortByName(a.record, b.record)).slice(0, 60).map((item) => item.record);
  }

  function renderSearchResults(results) {
    const container = document.getElementById('search-results');
    state.searchResults = results;
    state.searchIndex = results.length ? 0 : -1;
    container.hidden = false;
    if (!results.length) {
      container.innerHTML = '<div class="search-empty">没有匹配项。可直接搜索完整 ROS 名称或消息类型。</div>';
      return;
    }
    container.innerHTML = results.map((record, index) => `<button class="search-item ${index === state.searchIndex ? 'active' : ''}" type="button" data-select="${escapeHtml(record.key)}">${kindBadge(record.kind)}<span class="search-name mono">${escapeHtml(record.name)}</span><span class="search-meta">${record.domainLabel ? escapeHtml(record.domainLabel) : record.observedOn?.join(' · ') || '未归属'}</span></button>`).join('');
  }

  function updateSearchActive() {
    document.querySelectorAll('.search-item').forEach((item, index) => item.classList.toggle('active', index === state.searchIndex));
    document.querySelector('.search-item.active')?.scrollIntoView({ block: 'nearest' });
  }

  function closeSearch() {
    document.getElementById('search-results').hidden = true;
    state.searchResults = [];
    state.searchIndex = -1;
  }

  function bindEvents() {
    document.addEventListener('click', (event) => {
      const highlightButton = event.target.closest('[data-highlight]');
      if (highlightButton) {
        highlightRecord(highlightButton.dataset.highlight);
        return;
      }
      const selectButton = event.target.closest('[data-select]');
      if (selectButton) {
        selectRecord(selectButton.dataset.select);
        return;
      }
      const quick = event.target.closest('[data-quick]');
      if (quick) {
        const exact = searchable.find((record) => record.name === quick.dataset.quick);
        if (exact) selectRecord(exact.key);
        return;
      }
      if (!event.target.closest('.search-shell')) closeSearch();
    });

    const input = document.getElementById('global-search');
    input.addEventListener('input', () => {
      const query = input.value;
      if (!query.trim()) { closeSearch(); return; }
      renderSearchResults(search(query));
    });
    input.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowDown' && state.searchResults.length) {
        event.preventDefault();
        state.searchIndex = (state.searchIndex + 1) % state.searchResults.length;
        updateSearchActive();
      } else if (event.key === 'ArrowUp' && state.searchResults.length) {
        event.preventDefault();
        state.searchIndex = (state.searchIndex - 1 + state.searchResults.length) % state.searchResults.length;
        updateSearchActive();
      } else if (event.key === 'Enter' && state.searchResults[state.searchIndex]) {
        event.preventDefault();
        selectRecord(state.searchResults[state.searchIndex].key);
      } else if (event.key === 'Escape') {
        closeSearch();
        input.blur();
      }
    });
    input.addEventListener('focus', () => { if (input.value.trim()) renderSearchResults(search(input.value)); });

    document.addEventListener('keydown', (event) => {
      if (event.key === '/' && document.activeElement !== input) {
        event.preventDefault();
        input.focus();
        input.select();
      }
    });

    document.querySelectorAll('[data-toggle]').forEach((label) => {
      const checkbox = label.querySelector('input');
      checkbox.addEventListener('change', () => {
        const kind = label.dataset.toggle;
        if (checkbox.checked) state.enabledKinds.add(kind); else state.enabledKinds.delete(kind);
        label.classList.toggle('on', checkbox.checked);
        refreshCurrentView({ preserveScroll: true });
      });
    });

    document.getElementById('trace-mode').addEventListener('click', (event) => {
      state.traceRaw = !state.traceRaw;
      event.currentTarget.textContent = state.traceRaw ? '原始全图' : '业务链路';
      event.currentTarget.classList.toggle('primary', !state.traceRaw);
      refreshCurrentView({ preserveScroll: true });
    });
    document.getElementById('clear-path').addEventListener('click', restoreFullChain);
    document.getElementById('reset-view').addEventListener('click', showOverview);
    document.getElementById('back-overview').addEventListener('click', showOverview);
    document.getElementById('zoom-in').addEventListener('click', () => updateZoom(state.zoom + 0.1));
    document.getElementById('zoom-out').addEventListener('click', () => updateZoom(state.zoom - 0.1));
    document.getElementById('zoom-fit').addEventListener('click', fitZoom);

    const viewport = document.getElementById('graph-viewport');
    let drag = null;
    viewport.addEventListener('mousedown', (event) => {
      if (event.button !== 0 || event.target.closest('button')) return;
      drag = { x: event.clientX, y: event.clientY, left: viewport.scrollLeft, top: viewport.scrollTop };
      viewport.classList.add('dragging');
    });
    window.addEventListener('mousemove', (event) => {
      if (!drag) return;
      viewport.scrollLeft = drag.left - (event.clientX - drag.x);
      viewport.scrollTop = drag.top - (event.clientY - drag.y);
    });
    window.addEventListener('mouseup', () => { drag = null; viewport.classList.remove('dragging'); });
  }

  document.getElementById('capture-time').textContent = `${formatCaptureTime(DATA.capturedAt)} CST`;
  document.getElementById('topic-count').textContent = DATA.counts.topics;
  document.getElementById('service-count').textContent = DATA.counts.services;
  document.getElementById('action-count').textContent = DATA.counts.actions;
  renderOverview();
  renderEmptyDetails();
  bindEvents();
})();
</script>
</body>
</html>
</template>

(() => {
  const frame = document.getElementById('topology-frame');
  const source = document.getElementById('topology-source');
  frame.srcdoc = source.innerHTML;
  source.remove();
})();
</script>
